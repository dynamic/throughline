name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Claude Code executes a command hook under Git Bash on native
        # Windows (issue #67) - this is the leg that answers "does it work
        # there", not just "does it parse as POSIX sh".
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # jq ships preinstalled on all three hosted runner images; shellcheck
      # does not on Windows. Checked rather than assumed, same discipline as
      # every hook's own jq-presence check.
      - name: Ensure jq
        run: command -v jq >/dev/null 2>&1 || { echo "jq missing on $RUNNER_OS" >&2; exit 1; }
      # Static analysis of file content - the result doesn't depend on which
      # OS runs it, so one leg is enough. Kept on Linux, where it's already
      # preinstalled, rather than installing it fresh on the other two.
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts (Linux)
        if: runner.os == 'Linux'
        run: shellcheck -s sh hooks/*.sh tests/*.sh scripts/*.sh
      # The manifest and typography gates live in scripts/ so CI and
      # .local-ci.json call the same code (issues #205-#207).
      - name: Manifests and versions (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/check-manifests.sh
      - name: Typography (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/check-typography.sh
      - name: Run hook tests
        run: sh tests/run.sh
      # Generated redaction sweep (issue #174): fails when the engine leaks more seeded
      # secrets than its pinned baseline. About a minute, so one OS is enough.
      - name: Redaction sweep (Linux)
        if: runner.os == 'Linux'
        run: sh tests/redaction-sweep.sh

  opencode-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .opencode-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test

  omp-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .omp-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Run tests
        run: bun test

  hermes-plugin:
    name: hermes plugin (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Hermes does not run natively on Windows, so no Windows leg.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run Hermes bridge tests
        run: python -m pytest tests/hermes -q
