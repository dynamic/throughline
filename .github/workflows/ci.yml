name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        # Claude Code executes a command hook under Git Bash on native
        # Windows (issue #67) - this is the leg that answers "does it work
        # there", not just "does it parse as POSIX sh".
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # jq ships preinstalled on all three hosted runner images; shellcheck
      # does not on Windows. Checked rather than assumed, same discipline as
      # every hook's own jq-presence check.
      - name: Ensure jq
        run: command -v jq >/dev/null 2>&1 || { echo "jq missing on $RUNNER_OS" >&2; exit 1; }
      # Static analysis of file content - the result doesn't depend on which
      # OS runs it, so one leg is enough. Kept on Linux, where it's already
      # preinstalled, rather than installing it fresh on the other two.
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint hooks and tests (Linux)
        if: runner.os == 'Linux'
        run: shellcheck -s sh hooks/*.sh tests/*.sh
      - name: Validate JSON manifests (Linux)
        if: runner.os == 'Linux'
        run: |
          jq -e '.hooks | keys' hooks/hooks.json >/dev/null
          jq -e '.name and .version' .claude-plugin/plugin.json >/dev/null
          jq -e '.plugins' .claude-plugin/marketplace.json >/dev/null
          jq -e '.name and .version' .codex-plugin/plugin.json >/dev/null
          jq -e '.plugins' .agents/plugins/marketplace.json >/dev/null
      - name: Check plugin version agreement (Linux)
        if: runner.os == 'Linux'
        run: |
          c=$(jq -r .version .claude-plugin/plugin.json)
          x=$(jq -r .version .codex-plugin/plugin.json)
          o=$(jq -r .version .opencode-plugin/package.json)
          if [ "$c" != "$x" ] || [ "$c" != "$o" ]; then
            echo "version drift: .claude-plugin/plugin.json=$c .codex-plugin/plugin.json=$x .opencode-plugin/package.json=$o" >&2
            exit 1
          fi
      - name: Run hook tests
        run: sh tests/run.sh

  opencode-plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .opencode-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run tests
        run: npm test
